<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Juste Prix</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <style>
        header {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            color: #007bff;
        }
        #formulaire small {
            display: none; /* Masqué par défaut, affiché en cas d'erreur */
        }
        @media (max-width: 576px) {
            header {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
  <div class="container">
  
    <!-- Header -->
    <div class="row justify-content-center mt-5">
      <header>
        Le Juste Prix
      </header>
    </div>
    
    <!-- Formulaire -->
    <div class="row justify-content-center mt-5 mb-4">   
      <div class="col-lg-6 col-md-8 col-sm-10">   
        <div class="bg-light p-4 shadow rounded">
          
          <form id="formulaire">
            <div class="form-row">
              <div class="col-9">
                <input id="prix" type="number" class="form-control" placeholder="Devinez le prix ! (0 à 1 000)" required />
              </div>
              <div class="col-3">
                <button type="submit" class="btn btn-primary btn-block">Deviner</button>
              </div>
            </div>
            <small class="text-danger mt-2">Vous devez rentrer un nombre valide.</small>
          </form>
          
        </div>  
      </div>
    </div>
    
    <!-- Instructions -->
    <div class="row justify-content-center">
      <div id="instructions" class="col-lg-8 col-md-10 col-sm-12"></div>
    </div>
    
  </div>

  <script src="script.js"></script>
</body>
</html>
